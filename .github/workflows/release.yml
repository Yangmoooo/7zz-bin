name: Release 7zz binaries

on:
  schedule:
    - cron: '38 2 * * *'
  workflow_dispatch:

jobs:
  get-version-info:
    name: Get latest 7-Zip version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_info.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Get latest 7-Zip release info
        id: get_info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=$(gh release view --repo ip7z/7zip --json tagName -q .tagName)
          echo "Latest tag: $TAG_NAME"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if our release already exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.get_info.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: get-version-info
    if: needs.get-version-info.outputs.release_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - uses: actions/checkout@v6
        with:
          repository: ip7z/7zip
          ref: ${{ needs.get-version-info.outputs.tag }}
          path: 7zip-src

      - name: Build 7zz
        shell: pwsh
        run: cd 7zip-src\CPP\7zip\Bundles\Alone2 && nmake PLATFORM=${{ matrix.arch }}

      - name: Build 7z.dll
        shell: pwsh
        run: cd 7zip-src\CPP\7zip\Bundles\Format7zF && nmake PLATFORM=${{ matrix.arch }}

      - name: Prepare artifact files
        shell: pwsh
        run: |
          mkdir 7zip-doc
          cp 7zip-src/DOC/*License.txt , 7zip-src/DOC/copying.txt 7zip-doc/
          cp 7zip-src/DOC/readme.txt , 7zip-src/DOC/src-history.txt 7zip-doc/

          mkdir asset
          cp 7zip-src/CPP/7zip/Bundles/Alone2/${{ matrix.arch }}/7zz.exe asset/
          cp 7zip-src/CPP/7zip/Bundles/Format7zF/${{ matrix.arch }}/7z.dll asset/
          cp -r 7zip-doc/ asset/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: asset/

  package-linux:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: get-version-info
    if: needs.get-version-info.outputs.release_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - name: Download and Extract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.get-version-info.outputs.tag }}"
          ARCH="${{ matrix.arch }}"

          gh release download "$TAG" -R ip7z/7zip -p "*-linux-$ARCH.tar.xz" --skip-existing

          mkdir -p asset/7zip-doc/
          tar -xf *-linux-$ARCH.tar.xz -C asset/7zip-doc/
          mv asset/7zip-doc/7zz* asset/

      - name: Upload Linux binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: asset/

  package-macos:
    name: Package macOS (universal)
    runs-on: ubuntu-latest
    needs: get-version-info
    if: needs.get-version-info.outputs.release_exists == 'false'
    steps:
      - name: Download and Extract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.get-version-info.outputs.tag }}"

          gh release download "$TAG" -R ip7z/7zip -p "*-mac.tar.xz" --skip-existing

          mkdir -p asset/7zip-doc/
          tar -xf *-mac.tar.xz -C asset/7zip-doc/
          mv asset/7zip-doc/7zz asset/

      - name: Upload macOS binary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: asset/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [get-version-info, build-windows, package-linux, package-macos]
    if: needs.get-version-info.outputs.release_exists == 'false'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare and Rename Assets for Release
        run: |
          mkdir release-assets

          for dir in artifacts/*/; do
            dirname=$(basename "$dir")
            echo "Processing $dirname..."

            if [[ "$dirname" == *"windows"* ]]; then
              (cd "$dir" && zip -r "../../release-assets/7zz-$dirname.zip" ./*)
            elif [[ "$dirname" == *"linux"* || "$dirname" == *"macos"* ]]; then
              chmod +x "$dir"/7zz*
              (cd "$dir" && tar caf "../../release-assets/7zz-$dirname.tar.xz" ./*)
            fi
          done

          echo "Assets prepared for release:"
          ls -l release-assets

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version-info.outputs.tag }}
          name: "7zz ${{ needs.get-version-info.outputs.tag }}"
          body: |
            This is an automated release. See the official changelog and release notes at:
            **[Official 7-Zip ${{ needs.get-version-info.outputs.tag }} Release Page](https://github.com/ip7z/7zip/releases/tag/${{ needs.get-version-info.outputs.tag }})**
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
